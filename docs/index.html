/* ---------------- time travel ---------------- */
function buildTimebar(){
  const wrap = document.getElementById("tdays"); wrap.innerHTML = "";
  const now = realClock(CITIES[activeCity].tz);
  for(let i=0;i<7;i++){
    const d = (now.day + i) % 7;
    const b = document.createElement("button");
    b.type = "button"; b.dataset.day = d;
    b.textContent = i===0 ? "Today" : i===1 ? "Tomorrow" : DAYS[d];
    b.onclick = () => {
      const hour = +document.getElementById("thour").value;
      timeAt = { day: d, mins: hour*60 };
      syncTimebar(); applyFilters(); syncLabels(); tick(); syncURL();
    };
    wrap.appendChild(b);
  }
  syncTimebar();
}
function syncTimebar(){
  const now = realClock(CITIES[activeCity].tz);
  const cur = timeAt || now;
  document.querySelectorAll("#tdays button").forEach(b=>
    b.setAttribute("aria-pressed", String(!!timeAt && +b.dataset.day===cur.day)));

/* ---------------- festival programme ---------------- */
const FEST   = (RAW.events && RAW.events.festivals) || {};
const EVENTS = (RAW.events && RAW.events.events)    || [];
const DAYNAME = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH   = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let PLAN = {};                       // eventId -> "going" | "friends" | "maybe"
let progDate = null;

const dayKey = d => d.toISOString().slice(0,10);
const parseDay = s => new Date(s + "T12:00:00Z");
const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60 + m; };
const fmtMin = m => String(Math.floor((m%1440)/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0");

// A festival shows from showFrom until the day after it ends.
function activeFestival(cityId){
  const today = dayKey(new Date());
  for(const k in FEST){
    const f = FEST[k];
    if(f.city !== cityId) continue;
    if(today >= f.showFrom && today <= f.to) return Object.assign({ id:k }, f);
  }
  return null;
}
function festDays(f){
  const out = [], a = parseDay(f.from), b = parseDay(f.to);
  for(let d = new Date(a); d <= b; d.setUTCDate(d.getUTCDate()+1)) out.push(dayKey(d));
  return out;
}
const eventsOn = (f, date) => EVENTS
  .filter(e => e.festival === f.id && e.date === date)
  .map(e => {
    const s = toMin(e.start);
    let en = e.dur ? s + e.dur : toMin(e.end);
    if(!e.dur && en <= s) en += 1440;             // runs past midnight
    return Object.assign({}, e, { s, e: en });
  })
  .sort((a,b) => a.s - b.s || a.name.localeCompare(b.name));

// straight-line distance, then a rough bike/taxi estimate — honest, not routed
function hop(aId, bId){
  const A = VENUES.find(v=>v.id===aId), B = VENUES.find(v=>v.id===bId);
  if(!A || !B || A.lat==null || B.lat==null) return null;
  const R = 6371, rad = x => x*Math.PI/180;
  const dLat = rad(B.lat-A.lat), dLon = rad(B.lon-A.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(A.lat))*Math.cos(rad(B.lat))*Math.sin(dLon/2)**2;
  const km = 2*R*Math.asin(Math.sqrt(h));
  return { km, mins: Math.max(5, Math.round(km/16*60) + 6) };   // ~16km/h door to door
}

/* ---- the grid ---- */
const PX_PER_HOUR = () => (innerWidth < 700 ? 54 : 78);
const CYCLE = { "": "going", going: "friends", friends: "maybe", maybe: "" };

function renderProgramme(){
  const f = activeFestival(activeCity); if(!f) return;
  const days = festDays(f);
  if(!progDate || !days.includes(progDate)){
    const today = dayKey(new Date());
    progDate = days.find(d => d >= today) || days[days.length-1];
  }
  document.getElementById("progTitle").textContent = f.short;
  document.getElementById("progSub").textContent =
    f.name + " · " + parseDay(f.from).getUTCDate() + "–" + parseDay(f.to).getUTCDate()
    + " " + MONTH[parseDay(f.to).getUTCMonth()];

  // day tabs
  const tabs = document.getElementById("progDays");
  tabs.innerHTML = "";
  days.forEach(d => {
    const dt = parseDay(d), n = eventsOn(f, d).length;
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", String(d === progDate));
    b.innerHTML = `<b>${DAYNAME[dt.getUTCDay()]}</b><i>${dt.getUTCDate()}</i>` +
                  (n ? `<u>${n}</u>` : `<u class="none">–</u>`);
    b.onclick = () => { progDate = d; renderProgramme(); };
    tabs.appendChild(b);
  });

  const evs = eventsOn(f, progDate);
  const body = document.getElementById("progBody");
  if(!evs.length){
    body.innerHTML = `<p class="prog-empty">Nothing listed for this day yet.</p>`;
    countMarks(); return;
  }

  const t0 = Math.floor(Math.min(...evs.map(e=>e.s))/60)*60;
  const t1 = Math.ceil (Math.max(...evs.map(e=>e.e))/60)*60;
  const pph = PX_PER_HOUR(), W = (t1-t0)/60*pph;
  const x = m => (m-t0)/60*pph;

  // one row per venue, ordered by when that venue's first event starts
  const rows = [];
  evs.forEach(e => {
    let r = rows.find(r => r.venue === e.venue);
    if(!r) rows.push(r = { venue:e.venue, venueId:e.venueId, items:[], lanes:[] });
    r.items.push(e);
  });
  const LH = 44;
  rows.forEach(r => {
    r.items.forEach(e => {
      let i = r.lanes.findIndex(l => l.every(x => e.s >= x.e || e.e <= x.s));
      if(i < 0){ r.lanes.push([e]); i = r.lanes.length - 1; } else r.lanes[i].push(e);
      e.lane = i;
    });
  });

  let ticks = "";
  for(let m = t0; m <= t1; m += 60)
    ticks += `<span class="tick" style="left:${x(m)}px">${fmtMin(m)}</span>`;

  body.innerHTML = `
    <div class="grid-scroll"><div class="grid" style="width:${W+8}px">
      <div class="ruler">${ticks}</div>
      ${rows.map(r => `
        <div class="row">
          <div class="rowlab"><b>${esc(r.venue)}</b></div>
          <div class="lane" style="height:${r.lanes.length*LH}px">
            ${[...Array(Math.round((t1-t0)/60))].map((_,i)=>
              `<span class="hour" style="left:${i*pph}px;width:${pph}px"></span>`).join("")}
            ${r.items.map(e => {
              const st = PLAN[e.id] || "";
              return `<button class="ev ${st}" data-ev="${esc(e.id)}"
                style="left:${x(e.s)}px;width:${Math.max(58, x(e.e)-x(e.s))}px;top:${e.lane*LH+3}px;height:${LH-6}px">
                <b>${esc(e.name)}</b><i>${e.start}–${e.endEst?"~":""}${e.end}</i></button>`;
            }).join("")}
          </div>
        </div>`).join("")}
    </div></div>`;

  body.querySelectorAll(".ev").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.ev;
      const next = CYCLE[PLAN[id] || ""];
      if(next) PLAN[id] = next; else delete PLAN[id];
      savePlan();
      el.className = "ev " + (PLAN[id] || "");
      countMarks();
    };
  });
  countMarks();
}
function countMarks(){
  const n = st => EVENTS.filter(e => PLAN[e.id] === st).length;
  const g = n("going"), fr = n("friends"), m = n("maybe");
  document.getElementById("progCount").textContent =
    (g||fr||m) ? g+" going · "+fr+" friends · "+m+" maybe" : "tap to shortlist";
}

/* ---------------- shareable state ---------------- */
// Public home, baked in at build time: inside the artifact sandbox location.href
// is an internal URL, so copying that would hand someone a dead link.
const SHARE_BASE = "https://joshmeisterpnj.github.io/netherrealm/";

function encodeState(){
  if(!activeCity) return "";
  let h = activeCity;
  if(activeVenue) h += "/" + activeVenue;
  const p = [];
  if(mode === "cluster" && hasGeo(activeCity)) p.push("v=cluster");   // map is the default
  if(openNow) p.push("open=1");
  if(timeAt)  p.push("t=" + timeAt.day + "-" + Math.floor(timeAt.mins/60));
  if(levels.size < 5) p.push("lv=" + [...levels].sort().join(""));
  return h + (p.length ? "?" + p.join("&") : "");
}
let muteURL = false;
function syncURL(){
  if(muteURL) return;
  history.replaceState(null, "", "#" + encodeState());
}
function parseHash(){
  const raw = location.hash.replace(/^#/, "");
  const [path, query] = raw.split("?");
  const [c, vid] = (path || "").split("/");
  return { c, vid, q: new URLSearchParams(query || "") };
}
// Applied AFTER openCity, which resets everything to defaults.
function applyStateParams(q){
  const lv = q.get("lv");
  if(lv){
    const set = new Set(lv.split("").map(Number).filter(n => n>=1 && n<=5));
    if(set.size) levels = set;
  }
  if(q.get("v") === "cluster" && mode !== "cluster"){
    mode = "cluster";
    document.body.classList.remove("mapmode");
    btnCluster.setAttribute("aria-pressed","true");
    btnMap.setAttribute("aria-pressed","false");
    layout();
  }
  const t = q.get("t");
  if(t){
    const [d,h] = t.split("-").map(Number);
    if(d>=0 && d<=6 && h>=0 && h<=23) timeAt = { day:d, mins:h*60 };
  }
  if(q.get("open") === "1"){
    openNow = true;
    document.getElementById("btnOpen").setAttribute("aria-pressed","true");
    document.getElementById("timebar").classList.add("on");
    buildTimebar();
  }
  hintEl.textContent = mode === "map"
    ? "Lines point to the true address · drag to move"
    : "Tap a venue · drag to move the cluster";
  syncTimebar(); syncRamp(); applyFilters(); syncLabels(); tick();
}
async function shareView(){
  const url = SHARE_BASE + "#" + encodeState();
  try{
    if(navigator.share){ await navigator.share({ title:"netherRealm", url }); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  try{ await navigator.clipboard.writeText(url); toast("Link copied"); }
  catch(e){ console.log(url); toast("Link in console"); }
}

/* ---------------- clock ---------------- */
function phaseOf(h){
  if(h>=5&&h<11) return "after hours";
  if(h>=11&&h<17) return "daylight";
  if(h>=17&&h<22) return "warm up";
  if(h>=22||h<1) return "doors";
  return "peak";
}
function tick(){
  const tz = activeCity ? CITIES[activeCity].tz : "Europe/London";
  if(timeAt && activeCity){
    document.getElementById("clockT").textContent =
      DAYS[timeAt.day]+" "+hhmm(Math.floor(timeAt.mins/60)*60)+" "+CITIES[activeCity].name.slice(0,3).toUpperCase();
    document.getElementById("clockP").textContent = "time travel";
    return;
  }
  const now = new Date();
  const s = new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false}).format(now);
  const h = +new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",hour12:false}).format(now);
  document.getElementById("clockT").textContent = s + " " + (activeCity?CITIES[activeCity].name.slice(0,3).toUpperCase():"LDN");
  document.getElementById("clockP").textContent = phaseOf(h);
}
setInterval(tick, 20000);
setInterval(()=>{ if(openNow) applyFilters(); }, 30000);

/* ---------------- boot ---------------- */
document.getElementById("brandCount").textContent = Object.keys(CITIES).length + " cities";
resize(); syncLabels(); tick(); setCityVars(null);
requestAnimationFrame(frame);
function route(){
  const { c, vid, q } = parseHash();
  if(!CITIES[c]) return;
  muteURL = true;
  openCity(c);
  applyStateParams(q);
  if(vid && VENUES.some(v=>v.id===vid)) openVenue(vid);
  muteURL = false;
  syncURL();
}
route();
addEventListener("hashchange", ()=>{
  const { c, vid, q } = parseHash();
  if(!CITIES[c]){ if(view!=="cities") goHome(); return; }
  if(c!==activeCity || q.toString()){
    muteURL = true;
    if(c!==activeCity) openCity(c);
    applyStateParams(q);
    muteURL = false;
  }
  if(vid && vid!==activeVenue && VENUES.some(v=>v.id===vid)) openVenue(vid);
  else if(!vid && activeVenue) closePanel();
});
</script>
