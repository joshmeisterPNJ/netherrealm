<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Electronic music venues in London, Paris, Berlin and Amsterdam, mapped by city colour and intensity.">
<meta name="theme-color" content="#050506">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="netherRealm">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html,body{margin:0;background:#050506}img{max-width:100%}[hidden]{display:none!important}</style>
<title>netherRealm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=DM+Mono:wght@300;400;500&family=Newsreader:opsz,wght@6..72,200..600&display=swap">
<style>
:root{
  --void:#050506; --void-2:#0b0b0d; --ink:#f2f0ee; --ink-dim:#9b9a9e; --ink-faint:#5e5d63;
  --line:#22222a; --panel:#0e0e11; --warn:#c9a227;
  --disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  --read:"Newsreader",Georgia,serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --city:#888; --city-soft:#888;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--ink);
  font-family:var(--disp);overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
#stage{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#stage.grabbing{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

.lbl{position:absolute;top:0;left:0;will-change:transform;transform:translate3d(-9999px,0,0);
  text-align:center;white-space:nowrap;pointer-events:none}
.lbl-city .n{font-family:var(--disp);font-variation-settings:"wdth" 118,"wght" 700;
  font-size:clamp(18px,4.2vw,30px);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);text-shadow:0 2px 24px rgba(0,0,0,.9)}
.lbl-city .c{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.42);margin-top:6px}
.lbl-ven{transform-origin:50% 0}
.lbl-ven .n{font-family:var(--disp);font-variation-settings:"wdth" 96,"wght" 600;
  font-size:12.5px;letter-spacing:.055em;color:var(--ink);text-shadow:0 1px 10px #000,0 0 22px #000}
.lbl-ven .a{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:3px}
.lbl-ven.is-draft .n::after{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;
  border:1px solid var(--warn);margin-left:6px;vertical-align:middle;opacity:.75}
.lbl.dim{opacity:.18;transition:opacity .3s}
@media (max-width:640px){ .lbl-ven .a{display:none} .lbl-ven .n{font-size:11.5px} }
.lbl-core{text-align:center}
.lbl-core .n{font-family:var(--disp);font-variation-settings:"wdth" 106,"wght" 700;
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
  text-shadow:0 1px 12px #000}
.lbl-core .c{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:5px}
@media (max-width:640px){
  .lbl-core .n{font-size:10px;letter-spacing:.1em;font-variation-settings:"wdth" 92,"wght" 700}
  .lbl-core .c{display:none}
}
.mapmode .lbl-ven .a{display:none}
.mapmode .lbl-ven .n{font-size:11.5px;font-variation-settings:"wdth" 92,"wght" 600}
.lbl-ven.is-hot .n{color:#fff}
.lbl-ven.is-hot .a{color:var(--ink-dim)}
.dist{display:flex;align-items:flex-end;gap:6px;height:92px}
.dcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.dbar{width:100%;border-radius:1px}
.dn{font-family:var(--mono);font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}
.dk{font-family:var(--mono);font-size:8.5px;color:var(--ink-faint)}
.dlegend{display:flex;justify-content:space-between;margin-top:8px;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}

/* ---------- chrome ---------- */
#top{position:fixed;top:0;left:0;right:0;padding:calc(16px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 16px calc(18px + env(safe-area-inset-left));display:flex;align-items:flex-start;
  justify-content:space-between;gap:12px;pointer-events:none;z-index:5}
#brand{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  color:var(--ink-faint);pointer-events:auto}
#brand b{color:var(--ink-dim);font-weight:400}
#clock{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-align:right;color:var(--ink-faint);
  pointer-events:auto;line-height:1.7}
#clock .t{color:var(--city-soft);font-variant-numeric:tabular-nums}
#clock .ph{text-transform:uppercase;letter-spacing:.2em}

#back{position:fixed;top:calc(52px + env(safe-area-inset-top));left:calc(18px + env(safe-area-inset-left));z-index:6;display:none;align-items:center;gap:9px;
  background:none;border:0;padding:8px 0;color:var(--ink-dim);cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase}
#back.on{display:flex}
#back:hover{color:var(--ink)}
#back .ar{display:inline-block;width:16px;height:1px;background:currentColor;position:relative}
#back .ar::before{content:"";position:absolute;left:0;top:-3px;width:7px;height:7px;
  border-left:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg)}

#hint{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink-faint);pointer-events:none;transition:opacity .5s}

/* intensity legend, city view */
#legend{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));z-index:5;display:none;align-items:center;gap:10px;
  font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint)}
#legend.on{display:flex}
#legend .ramp{display:flex;gap:3px}
#legend .ramp i{width:13px;height:13px;border-radius:50%;display:block}

/* ---------- panel ---------- */
#panel{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);
  display:flex;flex-direction:column;visibility:hidden;opacity:0;
  transition:opacity .34s ease, transform .34s cubic-bezier(.16,.84,.34,1), visibility .34s}
@media (max-width:820px){
  #panel{left:0;right:0;bottom:0;max-height:82svh;padding-bottom:env(safe-area-inset-bottom);border-radius:20px 20px 0 0;border-bottom:0;
    transform:translateY(14px)}
}
@media (min-width:821px){
  #panel{top:0;right:0;bottom:0;width:min(460px,42vw);border-radius:0;border-right:0;border-top:0;border-bottom:0;
    transform:translateX(16px)}
}
#panel.on{visibility:visible;opacity:1;transform:none}
#panel::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--city);opacity:.85}
.pscroll{overflow-y:auto;overscroll-behavior:contain;padding:26px 24px 34px}
@media (max-width:820px){.pscroll{padding-top:20px}}

.grip{width:36px;height:3px;border-radius:2px;background:#2a2a32;margin:10px auto 0;flex:none}
@media (min-width:821px){.grip{display:none}}

#pclose{position:absolute;top:14px;right:14px;z-index:2;width:32px;height:32px;border-radius:50%;
  border:1px solid var(--line);background:#141419;color:var(--ink-dim);cursor:pointer;font-size:15px;line-height:1}
#pclose:hover{color:var(--ink);border-color:#39394a}

.p-eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--city-soft);display:flex;align-items:center;gap:8px}
.p-name{font-family:var(--disp);font-variation-settings:"wdth" 112,"wght" 700;
  font-size:clamp(26px,6vw,38px);line-height:1.02;letter-spacing:-.005em;text-transform:uppercase;
  margin:12px 0 0;text-wrap:balance}
.p-line{font-family:var(--read);font-size:17px;line-height:1.45;color:var(--ink-dim);margin:12px 0 0;max-width:38ch}

.p-meter{display:flex;align-items:center;gap:11px;margin:20px 0 0}
.p-meter .bars{display:flex;gap:4px}
.p-meter .bars i{width:26px;height:6px;border-radius:1px;background:#1c1c22;display:block}
.p-meter .cap{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint)}

.p-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin:22px 0 0}
.p-facts div{background:var(--panel);padding:12px 13px}
.p-facts dt{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}
.p-facts dd{margin:6px 0 0;font-family:var(--disp);font-variation-settings:"wdth" 100,"wght" 500;
  font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}

.p-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--ink-faint);margin:28px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.p-body{font-family:var(--read);font-size:15.5px;line-height:1.62;color:#c8c6ca;max-width:42ch}

.rooms{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
.room{background:var(--panel);padding:13px 14px;display:grid;grid-template-columns:14px 1fr;gap:12px;align-items:start}
.room .dot{width:14px;height:14px;border-radius:50%;margin-top:3px}
.room .rn{font-family:var(--disp);font-variation-settings:"wdth" 100,"wght" 600;font-size:13.5px;letter-spacing:.02em}
.room .rt{font-family:var(--read);font-size:14px;line-height:1.5;color:var(--ink-dim);margin-top:4px}

.nights{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.nights li{font-family:var(--read);font-size:14.5px;color:#c8c6ca;padding-left:16px;position:relative}
.nights li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:1px;background:var(--city);opacity:.8}
.equiv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:#0a0a0d;border:1px solid var(--line);padding:13px 14px;transition:border-color .2s,background .2s}
.equiv:hover{border-color:var(--city);background:#101015}
.equiv .dot{width:16px;height:16px;border-radius:50%;flex:none}
.equiv .t{flex:1;display:block}
.equiv .cn{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-faint)}
.equiv .vn{display:block;font-family:var(--disp);font-variation-settings:"wdth" 104,"wght" 600;
  font-size:14px;margin-top:4px;color:var(--ink)}
.equiv .ar{color:var(--ink-faint);font-size:15px}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 0}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--ink-dim)}

.links{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0}
.links a{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  padding:11px 15px;border:1px solid var(--line);color:var(--ink);text-decoration:none;
  display:flex;align-items:center;gap:8px;transition:border-color .2s,background .2s}
.links a:hover{border-color:var(--city);background:#141419}
.links a::after{content:"↗";opacity:.4;font-size:11px}

.nowbar{display:flex;align-items:center;gap:9px;margin:20px 0 0;padding:11px 13px;border:1px solid var(--line);background:#0a0a0d}
.nowbar .dot{width:7px;height:7px;border-radius:50%;flex:none}
.nowbar b{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.nowbar em{font-family:var(--read);font-style:normal;font-size:13.5px;color:var(--ink-dim)}
.flagbar{display:flex;gap:9px;align-items:flex-start;margin:22px 0 0;padding:12px 13px;
  border:1px solid #2a2410;background:#14120a}
.flagbar .k{width:6px;height:6px;border-radius:50%;border:1px solid var(--warn);margin-top:5px;flex:none}
.flagbar p{margin:0;font-family:var(--read);font-size:13.5px;line-height:1.5;color:#a99a6a}

/* editor */
.edtoggle{margin:26px 0 0;width:100%;padding:12px;background:none;border:1px dashed #2c2c36;color:var(--ink-faint);
  font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer}
.edtoggle:hover{color:var(--ink-dim);border-color:#3a3a48}
#editor{display:none;margin-top:18px;flex-direction:column;gap:16px}
#editor.on{display:flex}
.f label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:7px}
.f input[type=text],.f textarea{width:100%;background:#0a0a0d;border:1px solid var(--line);color:var(--ink);
  font-family:var(--read);font-size:15px;padding:10px 11px;border-radius:0;resize:vertical}
.f input[type=text]{font-family:var(--disp);font-size:14px}
.f input:focus,.f textarea:focus{outline:2px solid var(--city);outline-offset:-1px;border-color:transparent}
.pick{display:flex;gap:6px}
.pick button{flex:1;aspect-ratio:1.6;border:1px solid var(--line);cursor:pointer;position:relative;background:#0a0a0d}
.pick button span{position:absolute;inset:5px;border-radius:2px}
.pick button[aria-pressed=true]{border-color:var(--ink)}
.pick button:focus-visible{outline:2px solid var(--city);outline-offset:2px}
.erow{display:flex;gap:8px}
.erow button{flex:1;padding:12px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
.btn-save{background:var(--city);border:0;color:#08080a;font-weight:500}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--ink-dim)}
.btn-ghost:hover{color:var(--ink)}
#esave{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);min-height:12px}

/* city toolbar */
#tools{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(24px + env(safe-area-inset-bottom));
  z-index:6;display:none;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 36px);align-items:center}
#tools.on{display:flex}
#tools button{background:#0d0d10;border:1px solid var(--line);color:var(--ink-dim);cursor:pointer;
  padding:10px 13px;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase}
#tools button:hover{color:var(--ink);border-color:#3a3a48}
#tools #btnProg{color:var(--city);border-color:var(--city)}
#tools #btnProg:hover{background:var(--city);color:#08080a}
#tools #btnOpen{display:inline-flex;align-items:center;gap:8px;padding:11px 15px;
  color:var(--ink);border-color:#33333f}
#tools #btnOpen .live{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);flex:none}
#tools #btnOpen.has-open .live{background:hsl(140 60% 55%);
  box-shadow:0 0 0 3px hsl(140 60% 55% / .22)}
#tools #btnOpen:hover{border-color:var(--city)}
#tools #btnOpen[aria-pressed=true]{background:var(--city);color:#08080a;font-weight:500;border-color:var(--city)}
#tools #btnOpen[aria-pressed=true] .live{background:#08080a;box-shadow:none}
#tools .admin{opacity:.5}
#tools .admin:hover{opacity:1}
#views{display:inline-flex;border:1px solid var(--line);background:#0d0d10}
#views button{border:0;background:none;padding:10px 14px}
#views button[aria-pressed=true]{background:var(--city);color:#08080a;font-weight:500}
#views button[disabled]{opacity:.32;cursor:not-allowed}
#views button[disabled]:hover{color:var(--ink-dim)}
#legend .ramp{gap:4px}
#legend .ramp button{width:15px;height:15px;border-radius:50%;border:0;padding:0;cursor:pointer;
  display:block;transition:transform .15s,opacity .15s}
#legend .ramp button[aria-pressed=false]{opacity:.2;transform:scale(.68)}
#legend .ramp button:hover{transform:scale(1.18)}
#legend.filtered{color:var(--city-soft)}

#timebar{position:fixed;left:calc(18px + env(safe-area-inset-left));
  bottom:calc(68px + env(safe-area-inset-bottom));z-index:6;display:none;gap:6px;align-items:center;
  flex-wrap:wrap;max-width:calc(100vw - 36px)}
#timebar.on{display:flex}
#timebar button{background:#0d0d10;border:1px solid var(--line);color:var(--ink-dim);cursor:pointer;
  padding:7px 10px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase}
#timebar button:hover{color:var(--ink)}
#timebar button[aria-pressed=true]{background:var(--city);color:#08080a;border-color:var(--city)}
#tdays{display:inline-flex;gap:4px;flex-wrap:wrap}
#thourwrap{display:inline-flex;align-items:center;padding:0 8px;height:29px;
  background:#0d0d10;border:1px solid var(--line)}
#thour{-webkit-appearance:none;appearance:none;width:104px;height:3px;background:#2a2a33;outline:none}
#thour::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--city);cursor:pointer;border:0}
#thour::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--city);cursor:pointer;border:0}
#tread{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);padding-left:2px;min-width:58px}
#timebar.travelling #tread{color:var(--city-soft)}
#tools.on ~ #hint{bottom:calc(96px + env(safe-area-inset-bottom))}
#timebar.on ~ #hint{bottom:calc(140px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,8px);z-index:30;opacity:0;
  background:#16161b;border:1px solid var(--line);padding:11px 16px;pointer-events:none;
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
  transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* narrow screens: the controls wrap, so lift the count line clear of them
   and move the intensity ramp up under the clock */
/* the toolbar is bottom-left and the hint is centred, so they collide on any
   screen narrower than about 1230px - lift the hint whenever the toolbar shows */
#hint{max-width:calc(100vw - 36px);text-align:center;line-height:1.6}
@media (max-width:900px){
  #hint{font-size:9px;letter-spacing:.14em}
  #legend{top:calc(66px + env(safe-area-inset-top));bottom:auto}
}
#prog{position:fixed;inset:0;z-index:40;background:var(--void);display:none;
  grid-template-rows:auto auto 1fr;overflow:hidden}
#prog.on{display:grid}
.prog-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:calc(18px + env(safe-area-inset-top)) 20px 12px}
.prog-top h2{margin:0;font-family:var(--disp);font-variation-settings:"wdth" 118,"wght" 800;
  font-size:clamp(30px,7vw,46px);letter-spacing:.04em;line-height:1;color:var(--city)}
.prog-top p{margin:7px 0 0;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-faint)}
#progClose{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);
  background:#141419;color:var(--ink-dim);cursor:pointer;font-size:15px}
#progClose:hover{color:var(--ink)}

#progDays{display:flex;gap:6px;padding:0 20px 14px;overflow-x:auto;align-items:center}
#progCount{margin:6px 0 0;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--city-soft)}
#progDays button{flex:none;background:#0d0d10;border:1px solid var(--line);cursor:pointer;
  padding:9px 13px;display:flex;align-items:baseline;gap:7px;color:var(--ink-dim)}
#progDays button b{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
#progDays button i{font-family:var(--disp);font-style:normal;font-variation-settings:"wght" 700;font-size:15px}
#progDays button u{text-decoration:none;font-family:var(--mono);font-size:9px;color:var(--city-soft)}
#progDays button u.none{color:var(--ink-faint)}
#progDays button[aria-pressed=true]{background:var(--city);border-color:var(--city);color:#08080a}
#progDays button[aria-pressed=true] u{color:#08080a}

#progBody{overflow:hidden;min-height:0}
.grid-scroll{height:100%;overflow:auto;padding:0 20px 24px}
.grid{position:relative;min-height:100%}
.ruler{position:sticky;top:0;z-index:3;height:24px;margin-left:var(--lab);background:var(--void)}
.ruler .tick{position:absolute;top:0;font-family:var(--mono);font-size:9px;
  letter-spacing:.1em;color:var(--ink-faint);transform:translateX(-50%)}
.row{display:grid;grid-template-columns:var(--lab) 1fr;align-items:stretch;margin-bottom:5px}
.rowlab{position:sticky;left:0;z-index:2;background:var(--void);padding:6px 12px 6px 0;
  display:flex;align-items:flex-start}
.rowlab b{padding-top:11px}
.rowlab b{font-family:var(--disp);font-variation-settings:"wdth" 96,"wght" 600;font-size:12.5px;
  color:var(--ink-dim);line-height:1.25}
.lane{position:relative;border-left:1px solid var(--line)}
.lane .hour{position:absolute;top:0;bottom:0;border-right:1px solid #141419}
.ev{position:absolute;border:1px solid var(--line);background:#101014;
  cursor:pointer;text-align:left;padding:6px 9px;overflow:hidden;color:var(--ink-dim);
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  transition:background .15s,border-color .15s}
.ev b{font-family:var(--disp);font-variation-settings:"wdth" 96,"wght" 600;font-size:12px;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev i{font-family:var(--mono);font-style:normal;font-size:9px;letter-spacing:.1em;color:var(--ink-faint)}
.ev:hover{border-color:var(--city)}
.ev.going{background:var(--city);border-color:var(--city)}
.ev.going b,.ev.going i{color:#08080a}
.ev.friends{border-color:var(--city);border-style:solid;background:#101014;
  box-shadow:inset 3px 0 0 var(--city)}
.ev.maybe{border-style:dashed;border-color:#3a3a48}

.prog-empty{font-family:var(--read);font-size:14px;color:var(--ink-dim);margin:4px 0;max-width:56ch}
#prog{--lab:132px}
@media (max-width:700px){ #prog{--lab:96px} .pl-gap{margin-left:0} .pl-t{min-width:80px} }

/* the city carries its festival while it is on */
.lbl-city .fest{display:block;font-family:var(--disp);
  font-variation-settings:"wdth" 118,"wght" 800;font-size:15px;letter-spacing:.16em;
  color:var(--city-soft);margin-bottom:2px}

:focus-visible{outline:2px solid var(--city);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>

</head>
<body>

<canvas id="stage"></canvas>
<div id="labels"></div>

<header id="top">
  <div id="brand">netherRealm &nbsp;<b id="brandCount">cities</b></div>
  <div id="clock"><div class="t" id="clockT">—</div><div class="ph" id="clockP"></div></div>
</header>

<button id="back"><span class="ar"></span>All cities</button>

<div id="legend">

</div>

<div id="timebar">
  <button id="tnow" type="button" aria-pressed="true">Now</button>
  <span id="tdays"></span>
  <label id="thourwrap"><input id="thour" type="range" min="0" max="23" step="1" value="22" aria-label="Hour"></label>

</div>
<div id="tools">

  <button id="btnShare" class="admin">Share view</button>
  <button id="btnAdd" class="admin">+ Venue</button>
  <button id="btnExport" class="admin">Export JSON</button>
</div>

<div id="hint">Tap a city</div>
<div id="toast"></div>

<div id="prog" aria-hidden="true">

    <div><h2 id="progTitle">ADE</h2><p id="progSub"></p><p id="progCount"></p></div>
    <button id="progClose" aria-label="Close">✕</button>
  </header>
  <nav id="progDays"></nav>
  <div id="progBody"></div>
</div>

<aside id="panel" aria-hidden="true">

  <button id="pclose" aria-label="Close">✕</button>
  <div class="pscroll" id="pscroll"></div>
</aside>

sity":3,"cap":600,"hours":"Fri–Sat into Monday, garden in summer","line":"A wrecked apartment building you get lost inside.","note":"Three floors of an old apartment block, each room furnished like somebody's flat, plus a garden and a labyrinth. Getting lost is the intended experience. Under long-standing threat from the A100 motorway extension — VERIFY it's still open.","tags":["house","techno","outdoor","intimate","allnighter"],"rooms":[{"name":"Floor 1","intensity":3,"note":"House and disco."},{"name":"Floor 2","intensity":4,"note":"Harder, darker."},{"name":"Garden","intensity":2,"note":"Summer, daylight."}],"nights":["Fri–Sat, running into Monday"],"links":{"web":"https://renate.cc","ra":"https://ra.co/search?q=wilde%20renate","map":"https://www.google.com/maps/search/Salon+zur+Wilden+Renate+Alt-Stralau+Berlin"},"status":"unsure","draft":true,"open":{"5":[1380,3180],"6":[1380,3180]},"lat":52.502,"lon":13.468},{"id":"ohm","city":"berlin","name":"OHM","area":"Mitte — Kraftwerk","intensity":4,"cap":200,"hours":"Fri–Sat, late","line":"The power station's battery room, now the city's best small room.","note":"In the old battery room of the Kraftwerk complex, next to Tresor. Tiled, small, and programmed for electro, experimental and the more cerebral end of club music. Where you go when the main room is too obvious.","tags":["leftfield","techno","electro","intimate","adventurous"],"rooms":[],"nights":["Fri–Sat, experimental and electro programming"],"links":{"ra":"https://ra.co/search?q=ohm%20berlin","map":"https://www.google.com/maps/search/OHM+Berlin+K%C3%B6penicker+Stra%C3%9Fe"},"status":"open","draft":true,"lat":52.5092,"lon":13.4205,"open":{"5":[1380,1920],"6":[1380,1920]}},{"id":"traumabar","city":"berlin","name":"Trauma Bar und Kino","area":"Moabit","intensity":4,"cap":500,"hours":"Fri–Sat, late","line":"Art performance and hard club music in the same night.","note":"Where the club and the art world actually overlap — performance, fashion, deconstructed club, and lineups that don't look like anyone else's. Visually the most ambitious room in the city. Not a place to go on autopilot.","tags":["leftfield","queer","adventurous","heavy","artschool"],"rooms":[],"nights":["Fri–Sat, art and club crossover programming"],"links":{"ra":"https://ra.co/search?q=trauma%20bar%20und%20kino","map":"https://www.google.com/maps/search/Trauma+Bar+und+Kino+Berlin"},"status":"open","draft":true,"lat":52.532,"lon":13.369,"open":{"5":[1380,1920],"6":[1380,1920]}},{"id":"else","city":"berlin","name":"Else","area":"Treptow","intensity":3,"cap":800,"hours":"Summer season, afternoon into the night","line":"Riverside sand, a dome, and a long summer afternoon.","note":"Open-air on the Spree next to the old Eisfabrik site, with a geodesic dome and sand underfoot. Summer season only. The daytime-into-night arc here is one of the best in Berlin.","tags":["outdoor","daytime","house","warm"],"rooms":[],"nights":["Summer season, weekends from afternoon"],"links":{"ra":"https://ra.co/search?q=else%20berlin","map":"https://www.google.com/maps/search/Else+Berlin+Treptow"},"status":"open","draft":true,"lat":52.496,"lon":13.452},{"id":"panke","city":"berlin","name":"Panke","area":"Wedding","intensity":2,"cap":200,"hours":"Evenings, weekends late","line":"Broken beat, jazz, hip-hop — the non-techno Berlin.","note":"A courtyard space in Wedding programming the parts of Black music culture that Berlin's techno monoculture ignores — broken beat, jazz, soul, hip-hop, live bands. Cheap, friendly, and a genuine relief.","tags":["warm","leftfield","cheap","intimate","listening"],"rooms":[],"nights":["Live and DJ programming, most weekends"],"links":{"web":"https://www.pankeculture.com","ra":"https://ra.co/search?q=panke%20berlin","map":"https://www.google.com/maps/search/Panke+Gerichtstra%C3%9Fe+Berlin+Wedding"},"status":"open","draft":true,"open":{"4":[1140,1620],"5":[1140,1620],"6":[1140,1620]},"lat":52.545,"lon":13.372},{"id":"watergate","city":"berlin","name":"Watergate","area":"Kreuzberg — Oberbaumbrücke","intensity":3,"cap":700,"hours":"Was Fri–Sat into Sunday","line":"Floor-to-ceiling windows over the Spree at sunrise.","note":"Closed at the end of 2024 after 22 years. The Water Floor's glass wall onto the river, with the sun coming up behind the Oberbaumbrücke, was one of the defining images of Berlin clubbing. RIP.","tags":["house","techno","allnighter","historic"],"rooms":[],"nights":["—"],"links":{"ra":"https://ra.co/search?q=watergate%20berlin","map":"https://www.google.com/maps/search/Watergate+Falckensteinstra%C3%9Fe+Berlin"},"status":"closed","draft":true,"lat":52.501,"lon":13.445},{"id":"deschool","city":"amsterdam","name":"De School","area":"Nomadic — pop-ups & takeovers","intensity":5,"cap":600,"hours":"","line":"The building went. The crew, the ethos and the standard did not.","note":"The physical school closed, but the collective and its programming continue through pop-ups and curated takeovers across the city. This is the crew that set the Amsterdam standard — zero phones, pure music, dark room — and that prioritised local resident selectors over guest-name booking. Uncompromising techno and house.","tags":["nophones","techno","house","residents","pop-ups","uncompromising"],"rooms":[],"nights":["Pop-ups and takeovers — follow the crew, not an address"],"links":{"ra":"https://ra.co/search?q=de%20school%20amsterdam","map":"https://www.google.com/maps/search/Amsterdam"},"status":"open","draft":false,"equiv":"carbone"},{"id":"garagenoord","city":"amsterdam","name":"Garage Noord","area":"Noord","intensity":5,"cap":400,"hours":"","line":"Land a gig here and you have the stamp of cool.","note":"An old car repair shop in Amsterdam-Noord, and the absolute hotbed for leftfield and experimental club music, industrial rhythms and fast-tempo sounds. If you are an underground artist and you land a gig here, you have officially earned the ultimate stamp of cool among music lovers.","tags":["leftfield","experimental","industrial","fast","tastemaker"],"rooms":[],"nights":[],"links":{"web":"https://garagenoord.com","ra":"https://ra.co/search?q=garage%20noord","map":"https://www.google.com/maps/search/Garage+Noord+Amsterdam"},"status":"open","draft":false,"equiv":"lastation","lat":52.39,"lon":4.927,"open":{"5":[1380,1740],"6":[1380,1740]}},{"id":"parallel","city":"amsterdam","name":"Parallel","area":"Noord — Tolhuistuin","intensity":3,"cap":750,"hours":"","line":"Paradiso's incubator in the North. Where underground crosses over.","note":"Paradiso's sister venue in the North, acting as a dedicated incubator that bridges raw underground talent and mid-sized club spaces. Leans hard into forward-thinking club sounds and global electronic mutations — electronic Amapiano, high-tempo edits, hybrid bass — and serves as the launchpad for acts moving into the mainstream.","tags":["incubator","bass","global","forward","crossover"],"rooms":[],"nights":[],"links":{"web":"https://parallel.am","ra":"https://ra.co/search?q=parallel%20amsterdam","map":"https://www.google.com/maps/search/Parallel+Tolhuistuin+Amsterdam+Noord"},"status":"open","draft":false,"equiv":"lamachine","lat":52.3845,"lon":4.9,"open":{"5":[1380,1740],"6":[1380,1740]}},{"id":"radion","city":"amsterdam","name":"Radion","area":"Nieuw-West — Louwesweg","intensity":5,"cap":1500,"hours":"24-hour permit","line":"A former dental clinic running 24 hours on raw concrete.","note":"A former dental clinic turned 24-hour cultural sanctuary, highly respected for its raw industrial concrete aesthetic and deep, hypnotic techno bookings. They don't chase radio hits — they book artists who master the art of the extended storytelling set.","tags":["industrial","techno","hypnotic","24h","longsets"],"rooms":[],"nights":[],"links":{"web":"https://radion.amsterdam","ra":"https://ra.co/search?q=radion%20amsterdam","map":"https://www.google.com/maps/search/Radion+Louwesweg+Amsterdam"},"status":"open","draft":false,"equiv":"glazart","open":{"5":[1380,3540]},"lat":52.348,"lon":4.809},{"id":"paradiso","city":"amsterdam","name":"Paradiso","area":"Centrum — Weteringschans","intensity":2,"cap":1500,"hours":"","line":"A 19th-century church that is still a rite of passage.","note":"A converted 19th-century church that remains a sacred rite of passage. For electronic music lovers its late-night transformations and specialised ADE curations — the STOOR live hardware jams among them — prove it still holds immense cultural capital and respect.","tags":["institution","church","ade","livehardware","prestige"],"rooms":[{"name":"Grote Zaal","intensity":2,"note":"The main church hall — balconies, stained glass, the room everyone means."},{"name":"Kleine Zaal","intensity":3,"note":"Upstairs. Smaller and more club-shaped."}],"nights":[],"links":{"web":"https://www.paradiso.nl","ra":"https://ra.co/search?q=paradiso%20amsterdam","map":"https://www.google.com/maps/search/Paradiso+Weteringschans+Amsterdam"},"status":"open","draft":false,"equiv":"olympia","lat":52.3625,"lon":4.8835,"open":{"4":[1140,1620],"5":[1140,1620],"6":[1140,1620]}},{"id":"melkweg","city":"amsterdam","name":"Melkweg","area":"Centrum — Lijnbaansgracht","intensity":2,"cap":1400,"hours":"","line":"A dairy factory big enough to host the niche room and the huge one at once.","note":"A historic former dairy factory that has championed electronic music since the dawn of the Dutch rave scene. It hosts massive names, but the multi-room layout lets it run niche, cutting-edge underground nights — drum & bass, specialised techno, UK garage — on the same weekend.","tags":["institution","multiroom","dnb","garage","prestige"],"rooms":[{"name":"Max","intensity":2,"note":"The big hall. Where the massive names land."},{"name":"Oude Zaal / Rabozaal","intensity":3,"note":"The smaller rooms, where the cutting-edge nights run."}],"nights":[],"links":{"web":"https://www.melkweg.nl","ra":"https://ra.co/search?q=melkweg","map":"https://www.google.com/maps/search/Melkweg+Amsterdam"},"status":"op ellout.","note":"The sprawling industrial docklands venue that hosts festivals like DGTL. Despite the scale it keeps real prestige, because the programming stays fiercely focused on high-concept melodic techno, raw industrial beats and underground legends rather than commercial EDM.","tags":["industrial","festival","docklands","techno","scale"],"rooms":[],"nights":["Event-only — DGTL and large one-offs"],"links":{"ra":"https://ra.co/search?q=ndsm%20amsterdam","map":"https://www.google.com/maps/search/NDSM+Loods+Amsterdam"},"status":"open","draft":false,"equiv":"kilowatt","lat":52.401,"lon":4.893},{"id":"amaze","city":"amsterdam","name":"AMAZE","area":"Noord — Papaverweg","intensity":1,"cap":1500,"hours":"","line":"Eight stages of ID&T spectacle, built for total sensory immersion.","note":"A high-tech multi-room audiovisual labyrinth created by ID&T. Futuristic and premium, but it bypasses cheap club tropes by focusing on complete sensory immersion, spatial 11D sound, and booking refined, deep electronic selectors who use the technology to tell a complex sonic story.","tags":["immersive","audiovisual","premium","spatial","multiroom"],"rooms":[],"nights":[],"links":{"web":"https://www.amaze-amsterdam.com","ra":"https://ra.co/search?q=amaze%20amsterdam","map":"https://www.google.com/maps/search/AMAZE+Amsterdam"},"status":"open","draft":false,"equiv":"atelier","lat":52.4,"lon":4.896},{"id":"carbone","city":"paris","name":"Carbone","area":"10e — sous La Caserne","intensity":5,"cap":500,"hours":"","equiv":"deschool","line":"Ring a phone number to find out who is playing. No presale, no cameras.","note":"An enclave run by underground promoters in the basement of La Caserne, between Gare du Nord and Gare de l'Est. Photos are banned, there is no presale, and you call a phone number to learn the lineup. Prioritises dancefloor intimacy and local electronic talent over commercial hype — the Paris answer to the no-camera, dark-room, raw-community ethos.","tags":["nophones","techno","intimate","anti-mainstream","promoter-run"],"rooms":[],"nights":["No presale — the lineup is a phone call"],"links":{"ra":"https://ra.co/search?q=carbone%20paris","map":"https://www.google.com/maps/search/La+Caserne+Paris+10e"},"status":"open","draft":false,"lat":48.8788,"lon":2.3592,"open":{"5":[1439,1859],"6":[1439,1859]}},{"id":"lastation","city":"paris","name":"La Station — Gare des Mines","area":"18e — Porte d'Aubervilliers","intensity":5,"cap":800,"hours":"","equiv":"garagenoord","line":"A converted freight station for everything the mainstream will not touch.","note":"The exact spatial and musical mirror of a rugged, gritty hotbed — a converted suburban railway station dedicated to raw experimental electronic genres, leftfield mutations, industrial noise and rapid tempos, with an uncompromisingly anti-mainstream crowd. Outdoor yard runs in summer.","tags":["leftfield","experimental","industrial","fast","diy","anti-mainstream"],"rooms":[{"name":"Indoor","intensity":5,"note":"The warehouse room."},{"name":"La Cour","intensity":3,"note":"Outdoor yard, daytime, lighter."}],"nights":[],"links":{"ra":"https://ra.co/search?q=la%20station%20gare%20des%20mines","map":"https://www.google.com/maps/search/La+Station+Gare+des+Mines+Paris"},"status":"open","draft":false,"lat":48.899,"lon":2.3706,"open":{"5":[1380,1800],"6":[1380,1800]}},{"id":"lamachine","city":"paris","name":"La Machine du Moulin Rouge","area":"18e — Pigalle","intensity":3,"cap":1000,"hours":"","equiv":"parallel","line":"The dual-room launching pad for whatever breaks next.","note":"Shares the multi-genre incubator role exactly — the essential launching pad for emerging global electronic trends. High-tempo edits, hybrid bass and forward-thinking club sounds across four levels attached to the Moulin Rouge.","tags":["incubator","bass","global","forward","crossover","multiroom"],"rooms":[{"name":"Le Central","intensity":3,"note":"The vast main room. Where the bigger bookings land."},{"name":"La Chauffer mpiahall.com","ra":"https://ra.co/search?q=olympia%20paris","map":"https://www.google.com/maps/search/L%27Olympia+Boulevard+des+Capucines+Paris"},"status":"open","draft":false,"lat":48.8703,"lon":2.3283,"open":{"2":[1170,1410],"3":[1170,1410],"4":[1170,1410],"5":[1170,1410],"6":[1170,1410]}},{"id":"elysee","city":"paris","name":"Élysée Montmartre / Le Trianon","area":"18e — Bd de Rochechouart","intensity":2,"cap":1380,"hours":"","equiv":"melkweg","line":"Two historic halls on one boulevard, balconies intact.","note":"The connected complex matches it perfectly — historic architectural prestige and structural balconies, balancing live touring bands with diverse electronic club bills. The Trianon was built in 1894 in the garden of the Élysée Montmartre, and the two still run together for larger events.","tags":["institution","multiroom","prestige","balconies","historic"],"rooms":[{"name":"Élysée Montmartre","intensity":2,"note":"1380 capacity. Opened 1807, burned down 2011, reopened 2016."},{"name":"Le Trianon","intensity":2,"note":"1091 capacity. The 1894 café-concert next door."}],"nights":[],"links":{"ra":"https://ra.co/search?q=elysee%20montmartre","map":"https://www.google.com/maps/search/Elys%C3%A9e+Montmartre+Boulevard+de+Rochechouart+Paris"},"status":"open","draft":false,"lat":48.8825,"lon":2.3447,"open":{"4":[1170,1500],"5":[1170,1500],"6":[1170,1500]}},{"id":"virage","city":"paris","name":"Virage","area":"17e — sous le périphérique","intensity":4,"cap":1200,"hours":"","equiv":"lofi","line":"Semi-open-air under the ring road, built out of scrapped cars.","note":"Built under the open-air périphérique on the grounds of a former car pound, where the abandoned carcasses were reused for the decor. Mirrors the format completely — industrial aesthetic, open-air transitions, high-energy electronic programming and a community-driven dance culture, with a strong focus on LGBTQIA+ communities.","tags":["industrial","outdoor","queer","community","daytime","house"],"rooms":[],"nights":["Seasonal — spring through summer"],"links":{"ra":"https://ra.co/search?q=virage%20paris","map":"https://www.google.com/maps/search/Virage+Paris+17e+p%C3%A9riph%C3%A9rique"},"status":"open","draft":false,"lat":48.8955,"lon":2.3155,"open":{"5":[1080,1680],"6":[1080,1680]}},{"id":"fvtvr","city":"paris","name":"FVTVR","area":"13e — sous la Cité de la Mode","intensity":4,"cap":700,"hours":"","equiv":"shelter","line":"Brutalist, dark, minimal — and one of the best rigs in the country.","note":"The exact layout sibling: raw and minimalist, tucked underneath the Cité de la Mode et du Design on the Quai d'Austerlitz. Brutalist, dark, minimal visual clutter, and built around a premium latest-generation L-Acoustics system widely called one of the most sophisticated in the capital.","tags":["soundsystem","brutalist","techno","house","dark","dancers"],"rooms":[],"nights":[],"links":{"ra":"https://ra.co/search?q=fvtvr","map":"https://www.google.com/maps/search/FVTVR+34+Quai+d%27Austerlitz+Paris"},"status":"open","draft":false,"lat":48.839,"lon":2.37,"open":{"5":[1439,1859],"6":[1439,1859]}},{"id":"kilowatt","city":"paris","name":"Le Kilowatt","area":"Vitry-sur-Seine (banlieue sud)","intensity":3,"cap":3000,"hours":"","equiv":"ndsm","line":"Where Paris goes when the event needs a hangar, not a club.","note":"Large-scale industrial events that keep real underground credibility rely on spaces like this, plus specialised takeovers at the Le Bourget exhibition centre — treating the massive scale with architectural awe rather than a corny EDM festival vibe. Bar, club and open-air on one site south of the city.","tags":["industrial","scale","outdoor","techno","takeovers"],"rooms":[],"nights":["Event-led, plus Le Bourget takeovers for the largest bills"],"links":{"web":"https://lekilowatt.fr","ra":"https://ra.co/search?q=kilowatt%20vitry","map":"https://www.google.com/maps/search/Le+Kilowatt+Vitry-sur-Seine"},"status":"open","draft":false,"lat":48.7873,"lon":2.3925},{"id":"atelier","city":"paris","name":"Atelier des Lumières","area":"11e — ancienne fonderie","intensity":1,"cap":1200,"hours":"","equiv":"amaze","line":"140 projectors in a former foundry. Immersion first, clubbing second.","note":"Paris has no static, fully electronic venue of this kind — but the high-concept electronic live shows staged inside these immersive projection rooms capture the same multi-sensory execution. 3,300m² of former foundry, walls ten metres high, 140 video projectors and a spatialised sound system.","tags":["immersive","audiovisual","premium","spatial","projection"],"rooms":[],"nights":["Electronic takeovers and one-off live shows, not a weekly club"],"links":{"web":"https://www.atelier-lumieres.com","ra":"https://ra.co/search?q=atelier%20des%20lumieres","map":"https://www.google.com/maps/search/Atelier+des+Lumi%C3%A8res+Paris"},"status":"open","draft":false,"lat":48.8602,"lon":2.3797},{"id":"rexclub","city":"paris","name":"Rex Club","area":"2e — Grands Boulevards","intensity":4,"cap":700,"hours":"Wed–Sat 23:30–06:00","line":"The best-sounding room in France, and it knows it.","note":"Laurent Garnier's home room and the spiritual centre of French techno since the late 80s. The system is the reason to go — you hear things in records here you have never heard. Low ceiling, black walls, no distractions.","tags":["heavy","techno","institution","soundsystem"],"rooms":[],"nights":["Wed–Sat, techno-led programming"],"links":{"web":"https://www.rexclub.com","ra":"https://ra.co/search?q=rex%20club","map":"https://www.google.com/maps/search/Rex+Club+5+Boulevard+Poissonni%C3%A8re+Paris"},"status":"open","draft":true,"lat":48.8709,"lon":2.3466,"open":{"3":[1410,1800],"4":[1410,1800],"5":[1410,1800],"6":[1410,1800]}},{"id":"djoon","city":"paris","name":"Djoon","area":"13e — Quai d'Austerlitz","intensity":3,"cap":300,"hours":"Fri–Sat 23:30–06:00, occasional Sundays","line":"Soulful house for people who actually dance.","note":"The warm end of Paris. Deep, soulful ","techno","allnighter"],"rooms":[{"name":"Main","intensity":4,"note":"Dark club room."},{"name":"Terrasse","intensity":2,"note":"On the Seine. Sunrise here is worth staying for."}],"nights":["Fri–Sat techno programming"],"links":{"ra":"https://ra.co/search?q=nuits%20fauves","map":"https://www.google.com/maps/search/Nuits+Fauves+Paris"},"status":"open","draft":true,"lat":48.8412,"lon":2.3672,"open":{"5":[1410,1800],"6":[1410,1800]}},{"id":"lajava","city":"paris","name":"La Java","area":"20e — Belleville","intensity":4,"cap":400,"hours":"Fri–Sat 23:30–06:00","line":"A 1920s dance hall basement in Belleville.","note":"Historic room — Piaf played here — now a sweaty basement with good leftfield and club bookings. Belleville location means the night can continue in every direction afterwards.","tags":["house","leftfield","intimate","warm"],"rooms":[],"nights":["Fri–Sat, promoter-led"],"links":{"ra":"https://ra.co/search?q=la%20java%20paris","map":"https://www.google.com/maps/search/La+Java+105+Rue+du+Faubourg+du+Temple+Paris"},"status":"open","draft":true,"lat":48.8713,"lon":2.3737,"open":{"5":[1410,1800],"6":[1410,1800]}},{"id":"petitbain","city":"paris","name":"Petit Bain","area":"13e — Quai de la Gare","intensity":2,"cap":300,"hours":"Evenings into the night, rooftop in summer","line":"A floating barge with a rooftop and a garden.","note":"A boat moored on the Seine with a restaurant, a rooftop, and a club room in the hull. Lighter programming, great for an early-evening start before something heavier. Rooftop at sunset is the draw.","tags":["warm","outdoor","intimate","daytime"],"rooms":[{"name":"Rooftop","intensity":1,"note":"Sunset, drinks, light selections."},{"name":"Hull","intensity":3,"note":"The club room below deck."}],"nights":["Mixed live and club programming"],"links":{"web":"https://www.petitbain.org","ra":"https://ra.co/search?q=petit%20bain","map":"https://www.google.com/maps/search/Petit+Bain+Paris"},"status":"open","draft":true,"lat":48.834,"lon":2.3 nimal and techno. Industrial scale without leaving the city.","tags":["heavy","techno","bigroom","industrial","allnighter"],"rooms":[],"nights":["Fri–Sat, hard techno programming"],"links":{"ra":"https://ra.co/search?q=t7%20paris","map":"https://www.google.com/maps/search/T7+Paris+Expo+Porte+de+Versailles"},"status":"open","draft":false,"lat":48.8322,"lon":2.2877,"open":{"5":[1410,1860],"6":[1410,1860]}},{"id":"concrete","city":"paris","name":"Concrete","area":"12e — Port de la Rapée","intensity":5,"cap":1200,"hours":"Historically Saturday 07:00 through Sunday night","line":"The boat that invented the Paris after-hours.","note":"Closed in 2019. Listed because it changed the city — the Saturday-morning start and the 24-hour licence campaign that followed came out of here, and most of the current Paris scene grew from that crew. RIP.","tags":["heavy","techno","allnighter","historic"],"rooms":[],"nights":["—"],"links":{"ra":"https://ra.co/search?q=concrete%20paris","map":"https://www.google.com/maps/search/Port+de+la+Rap%C3%A9e+Paris"},"status":"closed","draft":true,"lat":48.845,"lon":2.3665},{"id":"thuishaven","city":"amsterdam","name":"Thuishaven","area":"Westpoort","intensity":3,"cap":3000,"hours":"24-hour licence — parties run from Saturday into Monday","line":"A permanent festival site on the industrial edge of the harbour.","note":"Tents, campfires, sculptures and a licence that lets it run for 48 hours. It's the closest thing to a permanent outdoor festival in a European city. Deeply un-serious in the best way — people are still there on Monday morning.","tags":["outdoor","daytime","allnighter","house","techno","24h"],"rooms":[{"name":"Main tent","intensity":4,"note":"The big one. Techno-leaning."},{"name":"Outdoor stages","intensity":2,"note":"Daylight, campfires, lighter."}],"nights":["Weekend-long, Saturday through Monday"],"links":{"web":"https://www.thuishaven.nl","ra":"https://ra.co/search?q=thuishaven","map":"https://www.google.com/maps/search/Thuishaven+ const CITIES = RAW.cities, BASE = RAW.venues;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- persistence ---------------- */
let DB = null, EDITS = {}, ADDED = [];
const LS = "nightform.v1";
function loadLocal(){ try{ const s=JSON.parse(localStorage.getItem(LS)||"{}");
  EDITS=s.edits||{}; ADDED=s.added||[]; PLAN=s.plan||{}; }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify({edits:EDITS,added:ADDED,plan:PLAN})); }catch(e){} }
async function savePlan(){
  saveLocal();
  if(DB){ try{ await DB.doc("plan/marks").set({map:PLAN}); }catch(e){} }
}

(async ()=>{
  try{
    DB = await claude.use("db");
    if(!DB) return;
    DB.doc("edits/venues").onSnapshot(s=>{
      if(s.exists){ EDITS = s.data().map || {}; saveLocal(); rebuild(true); }
    }, ()=>{});
    DB.doc("plan/marks").onSnapshot(s=>{
      if(s.exists){ PLAN = s.data().map || {}; saveLocal();
        if(document.getElementById("prog").classList.contains("on")) renderProgramme(); }
    }, ()=>{});

})();
async function persist(){

  if(!DB) return false;
  try{
    await DB.doc("edits/venues").set({map:EDITS});
    await DB.doc("edits/added").set({list:ADDED});

/* ---------------- data model ---------------- */
let VENUES = [];
function compose(){
  const all = BASE.concat(ADDED);
  VENUES = all.map(v=>{
    const e = EDITS[v.id];
    return e ? Object.assign({},v,e,{draft:false}) : v;
  }).filter(v=>!v.hidden);
}
compose();
const byCity = c => VENUES.filter(v=>v.city===c && v.status!=="closed")
  .sort((a,b)=>b.cap-a.cap);
const closedIn = c => VENUES.filter(v=>v.city===c && v.status==="closed");

/* colour: intensity 1..5 -> light..dark within the city hue */
function shade(cityId, intensity){
  const c = CITIES[cityId];
  const t = (Math.min(5,Math.max(1,intensity||3))-1)/4;
  const l = c.lightLo + (c.lightHi-c.lightLo)*t;
  const s = c.sat * (0.62 + 0.38*t);
  return {h:c.hue, s:s, l:l, rim:c.rim};
}
const css = k => `hsl(${k.h} ${k.s.toFixed(1)}% ${k.l.toFixed(1)}%)`;
const cssA = (k,a) => `hsl(${k.h} ${k.s.toFixed(1)}% ${k.l.toFixed(1)}% / ${a})`;

/* ---------------- stage ---------------- */
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
const labelsEl = document.getElementById("labels");
let W=0,H=0,DPR=1,SC=1;
function resize(){
  DPR = Math.min(2, devicePixelRatio||1);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+"px"; cv.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  SC = Math.min(W,H)/720;
  layout();
}
addEventListener("resize", resize);

let bodies = [];
let view = "cities";       // cities | city
let activeCity = null;
let activeVenue = null;
let pan = {x:0,y:0,tx:0,ty:0};

function mkBody(o){
  return Object.assign({
    x:W/2 + (Math.random()-.5)*60, y:H/2 + (Math.random()-.5)*60,
    vx:0, vy:0, r:1, tr:40, tx:W/2, ty:H/2,
    ph:Math.random()*Math.PI*2, spin:0.6+Math.random()*0.8,
    alpha:0, ta:1, tether:null
  }, o);
}

function layout(){
  if(view==="cities") layoutCities();
  else if(mode==="map" && hasGeo(activeCity)) layoutMap();
  else layoutCity();
  // the layouts assign every venue a target alpha, which would wipe Open now
  // and the intensity filter - so the filters always get the last word
  if(view==="city" && activeCity) applyFilters();
}

function layoutCities(){
  const ids = Object.keys(CITIES);
  const wide = W>820;
  const R = Math.min(W,H)*(wide?0.27:0.255);
  const cx = W/2, cy = H/2 + (wide?0:-8);
  const keep = new Map(bodies.filter(b=>b.kind==="city").map(b=>[b.id,b]));
  bodies = ids.map((id,i)=>{
    const a = -Math.PI/2 + i/ids.length*Math.PI*2 + Math.PI/4;
    const b = keep.get(id) || mkBody({kind:"city", id});
    b.kind="city"; b.id=id;
    b.tx = cx + Math.cos(a)*R * (wide?1.15:0.86);
    b.ty = cy + Math.sin(a)*R * (wide?0.92:1.02);
    b.tr = Math.min(W,H)*(wide?0.115:0.125);
    b.col = shade(id, 3.4);
    b.ta = 1; b.tether=null;
    return b;
  });
  pan.tx=0; pan.ty=0;
}

function layoutCity(){
  const c = activeCity;
  const wide = W>820;
  const panelW = (wide && activeVenue) ? Math.min(460, W*0.42) : 0;
  const fieldW = W - panelW;
  const cx = fieldW/2, cy = H*(wide?0.5:0.46);

  const list = byCity(c).concat(closedIn(c));
  const caps = list.map(v=>Math.log(Math.max(60,v.cap||300)));
  const lo = Math.min(...caps), hi = Math.max(...caps);

  // as a city fills up, bubbles shrink and the field widens, so the cluster stays readable
  const dens = Math.min(1.06, Math.sqrt(11 / Math.max(8, list.length)));
  const rOf = v => {
    const s = Math.log(Math.max(60,v.cap||300));
    const t = hi>lo ? (s-lo)/(hi-lo) : .5;
    return (32 + t*44) * SC * dens * (wide?1.04:1);
  };

  const core = bodies.find(b=>b.kind==="core") || mkBody({kind:"core", id:"core:"+c});
  core.kind="core"; core.id="core:"+c;
  core.tx=cx; core.ty=cy; core.tr = Math.max(46, Math.min(fieldW,H)*0.086);
  core.col = shade(c, 3.6); core.ta=1; core.tether=null;

  const keep = new Map(bodies.filter(b=>b.kind==="venue").map(b=>[b.id,b]));
  const next = [core];

  // golden-angle spiral over an ellipse — wide screens have room sideways, not down
  const GA = Math.PI*(3-Math.sqrt(5));
  const inner = core.tr*1.25;
  const grow = Math.min(1.34, 2 - dens);
  const base = Math.min(fieldW,H)*(wide?0.30:0.325)*grow;
  const rx = Math.max(170, Math.min(fieldW/2 - 90, inner + base*(wide?1.55:1.02)));
  const ry = Math.max(150, Math.min(H/2 - (openNow?152:104), inner + base));

  list.forEach((v,i)=>{
    const tr = rOf(v);
    const a  = i*GA - Math.PI/2;
    const ca = Math.cos(a), sa = Math.sin(a);
    // true polar radius: the ellipse edge in THIS direction, not a shared fraction of the
    // long axis - that was letting near-vertical venues settle on top of the hub
    const rOut = 1/Math.hypot(ca/rx, sa/ry);
    const rIn  = inner + tr + 14;
    const rad  = rIn + Math.sqrt((i+0.72)/list.length) * Math.max(46, rOut - rIn);
    // new bubbles emerge from the rim of the hub, not its middle
    const b = keep.get(v.id) || mkBody({kind:"venue", id:v.id,
      x: core.x + ca*core.tr, y: core.y + sa*core.tr, r:1});
    b.kind="venue"; b.id=v.id; b.v=v;
    b.tx = cx + ca*rad;
    b.ty = cy + sa*rad;
    b.tr = tr;
    b.col = shade(c, v.intensity);
    b.closed = v.status==="closed";
    b.unsure = v.status==="unsure";
    b.draft = !!v.draft;
    b.ta = b.closed ? .38 : 1;
    b.tether = core;
    next.push(b);
  });

  // exiled cities keep drifting outward
  bodies.filter(b=>b.kind==="city").forEach(b=>{
    if(b.id===c) return;
    const dx=b.x-W/2, dy=b.y-H/2, d=Math.hypot(dx,dy)||1;
    b.tx = W/2 + dx/d * Math.max(W,H)*1.15;
    b.ty = H/2 + dy/d * Math.max(W,H)*1.15;
    b.ta = 0; b.tr = b.tr*0.7; b.tether=null;
    next.push(b);
  });
  bodies = next;
}

/* ---------------- map mode ---------------- */
const GEO = RAW.geo || {};
let mode = "cluster";                 // cluster | map
const hasGeo = id => !!GEO[id] && VENUES.some(v=>v.city===id && v.lat!=null);

let PROJ = null;                      // {ox,oy,k,lat0,lon0}
function buildProjection(cityId, fieldW, fieldH){
  const g = GEO[cityId];
  const pts = VENUES.filter(v=>v.city===cityId && v.lat!=null).map(v=>[v.lat,v.lon])
    .concat(g ? g.boundary : []);
  const lats = pts.map(p=>p[0]), lons = pts.map(p=>p[1]);
  const latMin=Math.min(...lats), latMax=Math.max(...lats);
  const lonMin=Math.min(...lons), lonMax=Math.max(...lons);
  const lat0=(latMin+latMax)/2, lon0=(lonMin+lonMax)/2;
  const kx = Math.cos(lat0*Math.PI/180);            // equirectangular, corrected for latitude
  const w = (lonMax-lonMin)*kx, h = (latMax-latMin);
  const padX = fieldW*0.055 + 40, padY = fieldH*0.075 + (openNow?92:44);
  const k = Math.min((fieldW-padX*2)/w, (fieldH-padY*2)/h);
  PROJ = { k, kx, lat0, lon0, cx: fieldW/2, cy: fieldH/2 };
}
const projX = lon => PROJ.cx + (lon - PROJ.lon0)*PROJ.kx*PROJ.k;
const projY = lat => PROJ.cy - (lat - PROJ.lat0)*PROJ.k;

function layoutMap(){
  const c = activeCity, wide = W>820;
  const panelW = (wide && activeVenue) ? Math.min(460, W*0.42) : 0;
  const fieldW = W - panelW;
  buildProjection(c, fieldW, H);

  const full   = byCity(c).concat(closedIn(c));
  const list   = full.filter(v=>v.lat!=null);
  const nomads = full.filter(v=>v.lat==null);
  const core = bodies.find(b=>b.kind==="core");
  if(core){ core.ta = 0; core.tether = null; }

  const keep = new Map(bodies.filter(b=>b.kind==="venue").map(b=>[b.id,b]));
  const next = core ? [core] : [];
  const placed = [];

  list.forEach(v=>{
    const b = keep.get(v.id) || mkBody({kind:"venue", id:v.id, r:1});
    b.kind="venue"; b.id=v.id; b.v=v;
    b.nomad = false;
    b.ax = projX(v.lon); b.ay = projY(v.lat);          // the true point, never moves
    b.tr = Math.max(9, rOfMap(v, full)) ;
    b.col = shade(c, v.intensity);
    b.closed = v.status==="closed";
    b.draft = !!v.draft;
    b.ta = b.closed ? .38 : 1;
    b.tether = null;
    placed.push(b);
    next.push(b);
  });

  // relax overlaps off the anchors, then leave a leader line back to the truth
  for(const b of placed){ b.mx = b.ax; b.my = b.ay; }
  const MAX_LEAD = 74 * SC;                 // a bubble may never lie further than this from the truth
  for(let iter=0; iter<120; iter++){
    let moved = false;
    for(let i=0;i<placed.length;i++) for(let j=i+1;j<placed.length;j++){
      const a=placed[i], b=placed[j];
      let dx=b.mx-a.mx, dy=b.my-a.my, d=Math.hypot(dx,dy);
      if(d<0.001){ dx=Math.random()-.5; dy=Math.random()-.5; d=1; }
      const min=(a.tr+b.tr)*1.15 + 9;
      if(d<min){
        const push=(min-d)*0.35, ux=dx/d, uy=dy/d;
        a.mx-=ux*push; a.my-=uy*push; b.mx+=ux*push; b.my+=uy*push;
        moved = true;
      }
    }
    for(const b of placed){
      b.mx += (b.ax-b.mx)*0.055; b.my += (b.ay-b.my)*0.055;  // pull home
      const lx=b.mx-b.ax, ly=b.my-b.ay, l=Math.hypot(lx,ly);
      if(l>MAX_LEAD){ b.mx = b.ax + lx/l*MAX_LEAD; b.my = b.ay + ly/l*MAX_LEAD; }
    }
    if(!moved) break;
  }
  for(const b of placed){ b.tx = b.mx + pan.x; b.ty = b.my + pan.y; b.lead = Math.hypot(b.mx-b.ax, b.my-b.ay); }

  // no fixed address: parked along the foot of the map, still tappable
  nomads.forEach((v,i)=>{
    const b = keep.get(v.id) || mkBody({kind:"venue", id:v.id, r:1});
    b.kind="venue"; b.id=v.id; b.v=v;
    b.ax = null; b.ay = null; b.lead = 0; b.nomad = true;
    b.tr = Math.max(9, rOfMap(v, full));
    b.col = shade(c, v.intensity);
    b.closed = v.status==="closed";
    b.draft = !!v.draft;
    b.ta = b.closed ? .38 : 1;
    b.tether = null;
    b.tx = 46 + i*84 + pan.x;
    b.ty = H - 150 + pan.y;
    next.push(b);
  });

  bodies.filter(b=>b.kind==="city").forEach(b=>{ b.ta=0; b.tether=null; next.push(b); });
  bodies = next;
}
function rOfMap(v, list){
  const caps = list.map(x=>Math.log(Math.max(60,x.cap||300)));
  const lo=Math.min(...caps), hi=Math.max(...caps);
  const s=Math.log(Math.max(60,v.cap||300));
  const t = hi>lo ? (s-lo)/(hi-lo) : .5;
  return (7 + t*12) * SC * (W>820?1.0:0.9);
}

function paintMapGround(t){
  const g = GEO[activeCity]; if(!g || !PROJ) return;
  const k = shade(activeCity, 3);
  ctx.save();
  ctx.lineJoin = "round"; ctx.lineCap = "round";

  // water first, it sits under everything
  ctx.beginPath();
  g.water.forEach((p,i)=>{ const x=projX(p[1])+pan.x, y=projY(p[0])+pan.y; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.lineWidth = Math.max(2.5, 7*SC);
  ctx.strokeStyle = `hsl(${k.h} ${Math.min(60,k.s*0.5)}% ${k.rim?26:22}% / .55)`;
  ctx.stroke();

  // the boundary that actually changes your night: périph, Ringbahn, Zone 1, A10
  ctx.beginPath();
  g.boundary.forEach((p,i)=>{ const x=projX(p[1])+pan.x, y=projY(p[0])+pan.y; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.closePath();
  ctx.fillStyle = `hsl(${k.h} ${Math.min(50,k.s*0.4)}% ${k.rim?10:9}% / .34)`;
  ctx.fill();
  ctx.setLineDash([]);
  ctx.lineWidth = 1.1;
  ctx.strokeStyle = `hsl(${k.h} ${Math.min(70,k.s*0.6)}% ${k.rim?54:46}% / .40)`;
  ctx.stroke();
  ctx.restore();
}

function paintLeaders(){
  ctx.save();
  for(const b of bodies){
    if(b.kind!=="venue" || b.alpha<0.05 || b.ax==null || !(b.lead>2)) continue;
    if(openNow && b.ost==="closed") continue;
    const ax=b.ax+pan.x, ay=b.ay+pan.y;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y); ctx.lineTo(ax, ay);
    ctx.lineWidth = 1;
    ctx.strokeStyle = cssA(b.col, 0.42*b.alpha);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(ax, ay, 2.1, 0, 7);
    ctx.fillStyle = cssA(b.col, 0.85*b.alpha);
    ctx.fill();
  }
  ctx.restore();
}

/* ---------------- filters: intensity, open now, time travel ---------------- */
let openNow = false;
let timeAt  = null;                              // {day, mins} — null means right now
let levels  = new Set([1,2,3,4,5]);              // which intensities are showing
const DRAIN_OVER = 360;                          // "full" means six hours or more left

function realClock(tz){
  const p = new Intl.DateTimeFormat("en-GB",
    { timeZone: tz, weekday:"short", hour:"2-digit", minute:"2-digit", hourCycle:"h23" })
    .formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  return { day: {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[g("weekday")],
           mins: (+g("hour"))*60 + (+g("minute")) };
}
function cityClock(tz){ return timeAt || realClock(tz); }
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const hhmm = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");

// A session is keyed on the day it STARTS and may run past midnight, so look back
// far enough to catch Berlin's weekend-long runs.
function venueState(v, clock){
  if(v.status === "closed") return { state:"gone" };
  if(!v.open) return { state:"unknown" };
  for(let back=0; back<=3; back++){
    const d = (clock.day - back + 7) % 7;
    const s = v.open[d]; if(!s) continue;
    const elapsed = back*1440 + clock.mins;
    if(elapsed >= s[0] && elapsed < s[1]) return { state:"open", left: s[1]-elapsed };
  }
  return { state:"closed" };
}
const fmtLeft = m => m>=120 ? Math.round(m/60)+"h left"
                 : m>60    ? "1h "+(m-60)+"m left"
                 : m===60  ? "1h left"
                 : m+"m left";

function applyFilters(){
  if(!activeCity) return;
  const clock = cityClock(CITIES[activeCity].tz);
  let open=0, closing=0, unknown=0, shut=0, hidden=0;
  for(const b of bodies){
    if(b.kind!=="venue" || !b.v) continue;
    const st = venueState(b.v, clock);
    b.ost = st.state; b.oleft = st.left;
    b.fill = null; b.closing = false;

    b.filtered = !levels.has(Math.min(5, Math.max(1, b.v.intensity||3)));
    if(b.filtered){ b.ta = 0; hidden++; continue; }

    if(!openNow){ b.ta = b.closed ? .38 : 1; continue; }
    if(st.state==="open"){
      b.fill = Math.max(0.07, Math.min(1, st.left/DRAIN_OVER));
      b.closing = st.left <= 60;
      b.ta = 1; open++; if(b.closing) closing++;
    } else if(st.state==="unknown"){
      b.ta = 1; unknown++;                 // full brightness — dimming read as "closed-ish"
    } else {
      b.ta = 0; shut++;                    // gone
    }
  }
  const btn = document.getElementById("btnOpen");
  if(openNow){
    btn.classList.toggle("has-open", open>0);
    hintEl.textContent = open+" open"+(closing?" ("+closing+" closing soon)":"")
      + " · " + unknown + " check listings · " + shut + " shut"
      + (hidden ? " · " + hidden + " filtered out" : "");
    hintEl.style.opacity = "";
  }else{
    const any = VENUES.some(v=>v.city===activeCity && venueState(v,clock).state==="open");
    btn.classList.toggle("has-open", any);
    if(hidden){ hintEl.textContent = hidden+" filtered out · tap the scale to change"; }
  }
  syncRamp();
}

// Time left is drawn by ADDING light to the charged portion, never by darkening.
// An open venue is never dimmer than it is with the toggle off.
function paintDrain(b, t, hs){
  if(!openNow) return;

  if(b.ost === "unknown"){                       // "check listings" — full brightness, marked
    const R = b.r*hs;
    ctx.save();
    ctx.setLineDash([1, 4]);
    ctx.lineWidth = 1;
    ctx.strokeStyle = `hsl(${b.col.h} 30% 62% / ${0.5*b.alpha})`;
    ctx.beginPath(); ctx.arc(b.x, b.y, R+5, 0, 7); ctx.stroke();
    ctx.restore();
    return;
  }
  if(b.ost !== "open" || b.fill == null) return;

  const k = b.col, R = b.r*hs, top = b.y - R, h = R*2, y = top + h*(1-b.fill);

  ctx.save();
  blob(b, t, hs); ctx.clip();
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createLinearGradient(0, y, 0, top + h);
  g.addColorStop(0, `hsl(${k.h} ${Math.min(100,k.s+6)}% ${Math.min(74,k.l+20)}% / .52)`);
  g.addColorStop(1, `hsl(${k.h} ${k.s}% ${Math.min(60,k.l+8)}% / .18)`);
  ctx.fillStyle = g;
  ctx.fillRect(b.x-R-2, y, R*2+4, h*b.fill + 2);
  // the waterline
  ctx.globalCompositeOperation = "source-over";
  ctx.beginPath(); ctx.moveTo(b.x-R-2, y); ctx.lineTo(b.x+R+2, y);
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = `hsl(${k.h} ${Math.min(100,k.s+10)}% ${Math.min(88,k.l+38)}% / .9)`;
  ctx.stroke();
  ctx.restore();

}

/* ---------------- physics ---------------- */
function step(dt){
  const K = 0.052, D = 0.855;
  for(const b of bodies){
    b.vx += (b.tx + (b.kind==="city"?0:pan.x) - b.x)*K;
    b.vy += (b.ty + (b.kind==="city"?0:pan.y) - b.y)*K;
    b.vx *= D; b.vy *= D;
    b.x += b.vx; b.y += b.vy;
    b.r += (b.tr - b.r)*0.13;
    b.alpha += (b.ta - b.alpha)*0.10;
    b.hov = (b.hov||0) + ((hoverId===b.id?1:0) - (b.hov||0))*0.18;
  }
  // repulsion — only among venue bubbles, keeps the cluster jostling
  if(mode==="map" && view==="city") { pan.x += (pan.tx-pan.x)*0.16; pan.y += (pan.ty-pan.y)*0.16; return; }
  for(let i=0;i<bodies.length;i++){
    const a=bodies[i]; if(a.kind==="city") continue;
    for(let j=i+1;j<bodies.length;j++){
      const b=bodies[j]; if(b.kind==="city") continue;
      const dx=b.x-a.x, dy=b.y-a.y;
      let d=Math.hypot(dx,dy); if(d<0.01) d=0.01;
      const coreish = a.kind==="core" || b.kind==="core";
      const min = coreish ? (a.r+b.r+22) : (a.r+b.r)*1.32;
      if(d<min){
        const push=(min-d)/min*(coreish?2.6:1.9);
        const ux=dx/d, uy=dy/d;
        const ma = a.kind==="core"?0.02:1, mb = b.kind==="core"?0.02:1;
        a.vx-=ux*push*ma; a.vy-=uy*push*ma;
        b.vx+=ux*push*mb; b.vy+=uy*push*mb;
      }
    }
  }
  pan.x += (pan.tx-pan.x)*0.16; pan.y += (pan.ty-pan.y)*0.16;
}

/* ---------------- render ---------------- */
function blob(b,t,scale){
  const N=44, R=b.r*(scale||1);
  const w = REDUCED ? ()=>1 : a =>
    1 + 0.052*Math.sin(a*3 + t*0.00085*b.spin + b.ph)
      + 0.036*Math.sin(a*5 - t*0.00121*b.spin + b.ph*1.7)
      + 0.026*Math.sin(a*2 + t*0.00062 + b.ph*0.6);
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2, rr=R*w(a);
    const x=b.x+Math.cos(a)*rr, y=b.y+Math.sin(a)*rr;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.closePath();
}

function tentacle(from,to,t,col,alpha){
  const dx=to.x-from.x, dy=to.y-from.y, d=Math.hypot(dx,dy)||1;
  const ux=dx/d, uy=dy/d, px=-uy, py=ux;
  const sway = REDUCED?0:Math.sin(t*0.0011 + to.ph*3)*d*0.10;
  const cx=(from.x+to.x)/2 + px*sway, cy=(from.y+to.y)/2 + py*sway;
  const M=14, w0=Math.min(from.r*0.5, to.r*0.62);
  const L=[],Rr=[];
  for(let i=0;i<=M;i++){
    const s=i/M, is=1-s;
    const x=is*is*from.x + 2*is*s*cx + s*s*to.x;
    const y=is*is*from.y + 2*is*s*cy + s*s*to.y;
    const tx=2*is*(cx-from.x)+2*s*(to.x-cx), ty=2*is*(cy-from.y)+2*s*(to.y-cy);
    const tl=Math.hypot(tx,ty)||1;
    const nx=-ty/tl, ny=tx/tl;
    const w=w0*(1-s*0.82)*(0.55+0.45*Math.sin(s*Math.PI));
    L.push([x+nx*w,y+ny*w]); Rr.push([x-nx*w,y-ny*w]);
  }
  ctx.beginPath();
  ctx.moveTo(L[0][0],L[0][1]);
  for(let i=1;i<=M;i++) ctx.lineTo(L[i][0],L[i][1]);
  for(let i=M;i>=0;i--) ctx.lineTo(Rr[i][0],Rr[i][1]);
  ctx.closePath();
  ctx.fillStyle = cssA(col, 0.22*alpha);
  ctx.fill();
}

function paintBody(b,t){
  if(b.alpha<0.01 || b.r<0.5) return;
  const k = b.col, A = b.alpha, hs = 1 + 0.055*(b.hov||0);

  const shut = openNow && b.ost==="closed";
  const lit  = openNow && b.ost==="open";

  // outer glow
  if(!shut){
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const gr = b.r*hs*(mode==="map"&&view==="city"?1.9:2.9)*(lit?1.25:1);
  const g = ctx.createRadialGradient(b.x,b.y,b.r*0.3,b.x,b.y,gr);
  const gl = Math.min(72, k.l+26);
  g.addColorStop(0, `hsl(${k.h} ${k.s}% ${gl}% / ${((mode==="map"&&view==="city"?0.22:0.36)+(lit?0.26:0)+0.30*(b.hov||0))*A})`);
  g.addColorStop(0.45, `hsl(${k.h} ${k.s}% ${gl}% / ${0.09*A})`);
  g.addColorStop(1, `hsl(${k.h} ${k.s}% ${gl}% / 0)`);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,b.y,gr,0,7); ctx.fill();
  ctx.restore();
  }

  // body — volumetric fill
  ctx.save();
  blob(b,t,hs);
  const off = b.r*hs*0.34;
  const f = ctx.createRadialGradient(b.x-off, b.y-off, b.r*hs*0.08, b.x, b.y, b.r*hs*1.22);
  f.addColorStop(0, `hsl(${k.h} ${Math.min(100,k.s*1.05)}% ${Math.min(90,k.l+25)}% / ${A})`);
  f.addColorStop(0.55, `hsl(${k.h} ${k.s}% ${k.l}% / ${A})`);
  f.addColorStop(1, `hsl(${k.h} ${k.s*0.9}% ${Math.max(3,k.l-13)}% / ${A})`);
  ctx.fillStyle=f; ctx.fill();

  // rim light — carries Berlin, and edges everything else
  ctx.lineWidth = Math.max(1, b.r*hs*0.035) * (1 + 0.6*(b.hov||0));
  ctx.strokeStyle = k.rim
    ? `hsl(205 26% 88% / ${(0.60+0.35*(b.hov||0))*A})`
    : `hsl(${k.h} ${Math.min(100,k.s+8)}% ${Math.min(92,k.l+34+10*(b.hov||0))}% / ${(0.42+0.45*(b.hov||0))*A})`;
  ctx.stroke();
  ctx.restore();

  paintDrain(b, t, hs);

  // draft ring
  if(b.draft && !b.closed && !shut){
    ctx.save();
    ctx.setLineDash([2, 5]);
    ctx.lineWidth = 1;
    ctx.strokeStyle = `hsl(45 60% 62% / ${0.34*A})`;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*hs+7,0,7); ctx.stroke();
    ctx.restore();
  }
  if(b.closed){
    ctx.save();
    ctx.setLineDash([1, 4]);
    ctx.lineWidth = 1;
    ctx.strokeStyle = `hsl(0 0% 60% / ${0.30*A})`;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*hs+6,0,7); ctx.stroke();
    ctx.restore();
  }
  if(activeVenue===b.id){
    ctx.save();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = `hsl(0 0% 100% / ${0.85*A})`;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*hs+11,0,7); ctx.stroke();
    ctx.restore();
  }
}

function paintCore(b,t){
  if(b.alpha<0.01) return;
  const k=b.col, A=b.alpha, R=b.r*(1+0.04*(b.hov||0));
  ctx.save();
  // barely-there interior, so it reads as an opening rather than a hole
  const f=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,R);
  f.addColorStop(0, cssA(k,0.15*A)); f.addColorStop(1, cssA(k,0.02*A));
  ctx.beginPath(); ctx.arc(b.x,b.y,R,0,7); ctx.fillStyle=f; ctx.fill();
  // outer ring
  ctx.lineWidth=1.25*(1+0.5*(b.hov||0));
  ctx.strokeStyle=`hsl(${k.h} ${Math.min(90,k.s+10)}% ${k.rim?80:68}% / ${(0.52+0.30*(b.hov||0))*A})`;
  ctx.stroke();
  // slow inner dial - marks it as the hub, not a venue
  ctx.beginPath(); ctx.arc(b.x,b.y,R*0.80,0,7);
  ctx.setLineDash([1.5, 7]); ctx.lineDashOffset = REDUCED?0:-t*0.006;
  ctx.lineWidth=1;
  ctx.strokeStyle=`hsl(${k.h} ${Math.min(80,k.s)}% ${k.rim?72:64}% / ${0.34*A})`;
  ctx.stroke();
  ctx.restore();
}

let hoverId=null, last=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt = Math.min(40, t-last); last=t;
  step(dt);

  ctx.clearRect(0,0,W,H);
  // ambient ground
  const bg = ctx.createRadialGradient(W/2,H*0.42,0,W/2,H*0.42,Math.max(W,H)*0.75);
  bg.addColorStop(0,"#0a0a0d"); bg.addColorStop(1,"#050506");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  const mapping = mode==="map" && view==="city" && hasGeo(activeCity);
  if(mapping){ paintMapGround(t); paintLeaders(); }

  const core = bodies.find(b=>b.kind==="core");
  if(core && !mapping) for(const b of bodies){
    if(!b.tether || b.alpha<=0.02) continue;
    const dx=b.x-core.x, dy=b.y-core.y, d=Math.hypot(dx,dy)||1;
    const mouth={ x:core.x+dx/d*core.r*0.94, y:core.y+dy/d*core.r*0.94, r:core.r*0.42, ph:core.ph };
    if(openNow && b.ost==="closed") continue;
    tentacle(mouth,b,t,b.col,b.alpha*(1+0.9*(b.hov||0)));
  }

  for(const b of bodies) if(b.kind==="city") paintBody(b,t);
  if(core && !mapping) paintCore(core,t);
  // venues paint least-hovered first, so the hovered one always sits on top
  const vs = bodies.filter(b=>b.kind==="venue")
    .sort((p,q)=> ((p.hov||0)-(q.hov||0)) || (q.r-p.r));
  for(const b of vs) paintBody(b,t);

  positionLabels();
}

/* ---------------- labels ---------------- */
const lmap = new Map();
function syncLabels(){
  const want = new Set();
  for(const b of bodies){
    if(b.kind==="city" && view==="city") continue;
    if(b.kind==="core" && mode==="map") continue;
    want.add(b.id);
    if(lmap.has(b.id)) continue;
    const el = document.createElement("div");
    if(b.kind==="core"){
      el.className="lbl lbl-core";
      el.innerHTML = `<div class="n"></div><div class="c"></div>`;
      el.querySelector(".n").textContent = CITIES[activeCity].name;
      el.querySelector(".c").textContent = byCity(activeCity).length + " venues";
    }else if(b.kind==="city"){
      el.className="lbl lbl-city";
      el.innerHTML = `<div class="n"></div><div class="c"></div>`;
      el.querySelector(".n").textContent = CITIES[b.id].name;
      const f = activeFestival(b.id);
      if(f){
        const m = document.createElement("span");
        m.className = "fest"; m.textContent = f.short;
        el.querySelector(".n").before(m);
        el.querySelector(".c").textContent =
          parseDay(f.from).getUTCDate() + "–" + parseDay(f.to).getUTCDate() + " " +
          MONTH[parseDay(f.to).getUTCMonth()] + " · " + byCity(b.id).length + " venues";
      } else {
        el.querySelector(".c").textContent = CITIES[b.id].colourName + " · " + byCity(b.id).length + " venues";
      }
    }else{
      el.className="lbl lbl-ven"+(b.draft?" is-draft":"");
      el.innerHTML = `<div class="n"></div><div class="a"></div>`;
      el.querySelector(".n").textContent = b.v.name;
      el.querySelector(".a").textContent = b.closed ? "closed" : (b.v.area||"");
    }
    labelsEl.appendChild(el); lmap.set(b.id, el);
    el._w = el.offsetWidth; el._h = el.offsetHeight; el._vis = 0;   // measured once, never per frame
  }
  for(const [id,el] of lmap) if(!want.has(id)){ el.remove(); lmap.delete(id); }
}

const rectsHit = (a,b) => !(a.r < b.l || a.l > b.r || a.bt < b.t || a.t > b.bt);
function rectHitsCircle(r, cx, cy, rad){
  const nx = Math.max(r.l, Math.min(cx, r.r));
  const ny = Math.max(r.t, Math.min(cy, r.bt));
  return Math.hypot(cx-nx, cy-ny) < rad;
}

function positionLabels(){
  const items = [];
  for(const b of bodies){
    const el = lmap.get(b.id); if(!el) continue;
    const a = b.alpha;
    if(a < 0.03){ el.style.transform="translate3d(-9999px,0,0)"; el.style.opacity=0; continue; }
    const R = b.r * (1 + 0.055*(b.hov||0));
    if(b.kind === "core"){                       // sits inside the ring, always visible
      el.style.transform = `translate3d(${b.x|0}px,${b.y|0}px,0) translate(-50%,-50%)`;
      el.style.opacity = a;
      continue;
    }
    const w = el._w||90, hh = el._h||18;
    const pad = b.kind==="city" ? 18 : 11;
    items.push({ b, el, R, a, w, h:hh,
      below: b.y + R + pad,
      above: b.y - R - pad - hh });
  }

  // hovered first, then the biggest rooms — a name never sits on someone else's bubble
  const rank = b => openNow ? (b.ost==="open" ? 2 : b.ost==="unknown" ? 1 : 0) : 1;
  items.sort((p,q)=> ((q.b.hov||0)-(p.b.hov||0)) || (rank(q.b)-rank(p.b)) || (q.R-p.R));

  const taken = [];
  const fits = (it, y) => {
    const r = { l: it.b.x - it.w/2, r: it.b.x + it.w/2, t: y, bt: y + it.h };
    if(r.t < 2 || r.bt > H - 2) return null;
    for(const t of taken) if(rectsHit(r, t)) return null;
    for(const o of items){
      if(o === it) continue;
      const higher = (o.b.hov||0) > (it.b.hov||0) || (o.R > it.R && (o.b.hov||0) >= (it.b.hov||0));
      if(higher && rectHitsCircle(r, o.b.x, o.b.y, o.R)) return null;
    }
    return r;
  };

  for(const it of items){
    let rect = null;
    if(!(it.b.filtered) && !(openNow && it.b.ost==="closed")){
      rect = fits(it, it.below) || fits(it, it.above);   // fall back to sitting above
    }
    if(rect) taken.push(rect);
    const y = rect ? rect.t : it.below;
    it.el.style.transform = `translate3d(${it.b.x|0}px,${y|0}px,0) translate(-50%,0)`;
    el_ease(it.el, rect ? 1 : 0);
    it.el.style.opacity = it.el._vis * (it.b.closed?0.45:1) * it.a;
    it.el.style.zIndex = (it.b.hov||0) > 0.4 ? 3 : 1;
    it.el.classList.toggle("is-hot", (it.b.hov||0) > 0.4);
  }
}

function el_ease(el, target){
  if(el._vis === undefined) el._vis = target;
  el._vis += (target - el._vis) * 0.22;
}

/* ---------------- interaction ---------------- */
function hit(px,py){
  for(let i=bodies.length-1;i>=0;i--){
    const b=bodies[i];
    if(b.alpha<0.35) continue;
    if(b.filtered) continue;                       // filtered out: not a target
    if(openNow && b.ost==="closed") continue;      // shut: not a target
    if(view==="cities" && b.kind!=="city") continue;
    if(view==="city" && b.kind!=="venue" && b.kind!=="core") continue;
    if(Math.hypot(px-b.x,py-b.y) <= b.r+10) return b;
  }
  return null;
}
let down=null, moved=0, panning=false;
cv.addEventListener("pointerdown", e=>{
  down={x:e.clientX,y:e.clientY,px:pan.tx,py:pan.ty}; moved=0; panning=false;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e=>{
  if(!down){
    const b=hit(e.clientX,e.clientY);
    const id=b?b.id:null;
    if(id!==hoverId){ hoverId=id; cv.style.cursor = id?"pointer":"grab"; }
    return;
  }
  const dx=e.clientX-down.x, dy=e.clientY-down.y;
  moved=Math.max(moved,Math.hypot(dx,dy));
  if(view==="city" && moved>10){
    panning=true; cv.classList.add("grabbing");
    pan.tx = down.px+dx; pan.ty = down.py+dy;
  }
});
cv.addEventListener("pointerup", e=>{
  cv.classList.remove("grabbing");
  if(down && moved<9){
    const b=hit(e.clientX,e.clientY);
    if(b && b.kind==="city") openCity(b.id);
    else if(b && b.kind==="venue") openVenue(b.id);
    else if(b && b.kind==="core") openCityInfo();
    else closePanel();
  }
  down=null;
});
cv.addEventListener("pointercancel", ()=>{ down=null; cv.classList.remove("grabbing"); });
cv.addEventListener("pointerleave", ()=>{ hoverId=null; });
addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    const pg = document.getElementById("prog");
    if(pg.classList.contains("on")){ pg.classList.remove("on"); pg.setAttribute("aria-hidden","true"); return; }
    if(panel.classList.contains("on")) closePanel(); else if(view==="city") goHome(); }
});

/* ---------------- intensity scale as a filter ---------------- */
function buildRamp(id){
  const r = document.getElementById("ramp"); r.innerHTML = "";
  for(let i=1;i<=5;i++){
    const s = shade(id,i);
    const b = document.createElement("button");
    b.type = "button"; b.dataset.lv = i;
    b.title = INTENSITY_WORD[i];
    b.setAttribute("aria-label", INTENSITY_WORD[i]);
    b.style.background = css(s);
    if(s.rim) b.style.boxShadow = "inset 0 0 0 1px hsl(205 26% 80% / .55)";
    b.onclick = () => {
      if(levels.has(i)){ if(levels.size>1) levels.delete(i); }
      else levels.add(i);
      applyFilters(); syncLabels(); syncURL();
    };
    r.appendChild(b);
  }
  syncRamp();
}
function syncRamp(){
  document.querySelectorAll("#ramp button").forEach(b=>{
    b.setAttribute("aria-pressed", String(levels.has(+b.dataset.lv)));
